<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出门检查官与地球 Online · 完整矢量系统 QA</title><style>*{box-sizing:border-box}body{margin:0;background:#17201d;color:#eef0e9;font-family:system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1260px;margin:auto;padding:46px 24px 80px}h1{font:700 42px/1.25 "Noto Serif SC","Songti SC",serif;margin:8px 0}p{color:#b8c2bc;line-height:1.7}.section{margin-top:38px;border-top:1px solid #4b5a53;padding-top:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#f3f0e7;color:#25302b;border-radius:12px;padding:14px;min-height:88px;display:flex;align-items:center;gap:14px}.icons{display:flex;align-items:center;gap:9px;min-width:112px}.icons img{display:block}.s16{width:16px;height:16px}.s24{width:24px;height:24px}.s32{width:32px;height:32px}.s48{width:48px;height:48px}.s64{width:64px;height:64px}.label b{display:block}.label small{color:#6f7973}.dark{background:#25322d;color:#f2e5c8}.dark .label small{color:#b9c6bf}.dark img{filter:invert(93%) sepia(18%) saturate(412%) hue-rotate(350deg) brightness(103%)}.warn{margin-top:28px;padding:16px;background:#2b3833;line-height:1.8}@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:28px 14px}h1{font-size:31px}}</style></head><body><main class="wrap"><small>COMPLETE VECTOR SYSTEM QA · 2026.08.24</small><h1>快速识别，但不把生活做成图标猜谜。</h1><p>出门检查官检查 16/24/32px；地球 Online 检查 24/48/64px。图标只辅助文字，不能单独承担安全、医疗、儿童或隐私含义。</p><section class="section"><h2>出门检查官 · 场景 8</h2><div class="grid" id="scenes"></div></section><section class="section"><h2>出门检查官 · 类别 9</h2><div class="grid" id="categories"></div></section><section class="section"><h2>出门检查官 · 空间 9 + 状态 2</h2><div class="grid" id="spaces"></div></section><section class="section"><h2>地球 Online · 类别 10</h2><div class="grid" id="earthcats"></div></section><section class="section"><h2>地球 Online · 等级 3 + 状态 6</h2><div class="grid" id="earthstates"></div></section><div class="warn"><b>盲审问题：</b>场景／类别／空间是否能仅凭轮廓分组？带宠场景与宠物用品是否重复？办事与工作手续是否撞形？等级是否误成稀有度？任务状态是否过度游戏化？</div></main><script>
const dep='../projects/06-departure-checker/public/assets/icons/', earth='../projects/08-earth-online/public/assets/badges/';
const groups={scenes:{root:dep,size:'small',items:[['scene-commute.svg','日常通勤'],['scene-short-trip.svg','周末短途'],['scene-exercise.svg','运动健身'],['scene-date.svg','约会见面'],['scene-with-child.svg','带娃出门'],['scene-with-pet.svg','带宠出门'],['scene-appointment.svg','就医或办事'],['scene-event.svg','演出或活动']]},categories:{root:dep,size:'small',items:[['category-essentials.svg','随身要件'],['category-electronics.svg','电子设备'],['category-clothing-weather.svg','衣物天气'],['category-health-hygiene.svg','健康清洁'],['category-work-admin.svg','工作手续'],['category-sports.svg','运动用品'],['category-child.svg','儿童用品'],['category-pet.svg','宠物用品'],['category-event.svg','活动用品']]},spaces:{root:dep,size:'small',items:[['space-desk.svg','书桌'],['space-charging.svg','充电处'],['space-bedroom.svg','卧室'],['space-bathroom.svg','卫生间'],['space-fridge.svg','冰箱'],['space-entryway.svg','玄关'],['space-documents.svg','证件收纳'],['space-pet-area.svg','宠物用品区'],['space-child-area.svg','儿童用品区'],['completion-stamp.svg','完成印章'],['partial-availability.svg','部分可用']]},earthcats:{root:earth,size:'large',items:[['category-rest.svg','恢复精力'],['category-tidy.svg','整理生活'],['category-observe.svg','观察附近'],['category-move.svg','轻微运动'],['category-create.svg','创造东西'],['category-learn.svg','学习好奇'],['category-connect.svg','联系熟人'],['category-kind.svg','善意空间'],['category-digital.svg','数字生活'],['category-adventure.svg','微型冒险']]},earthstates:{root:earth,size:'large',items:[['rank-e.svg','E 级'],['rank-d.svg','D 级'],['rank-c.svg','C 级（未来）'],['status-available.svg','可领取'],['status-accepted.svg','已领取'],['status-completed.svg','已完成'],['status-skipped.svg','已跳过'],['status-expired.svg','已结束'],['completion-mark.svg','完成记录']]}};
for(const [id,g] of Object.entries(groups)){const host=document.getElementById(id);for(const [file,name] of g.items){const src=g.root+file,large=g.size==='large';host.insertAdjacentHTML('beforeend',`<article class="card ${large?'dark':''}"><div class="icons">${large?`<img class="s24" src="${src}" alt=""><img class="s48" src="${src}" alt=""><img class="s64" src="${src}" alt="">`:`<img class="s16" src="${src}" alt=""><img class="s24" src="${src}" alt=""><img class="s32" src="${src}" alt="">`}</div><span class="label"><b>${name}</b><small>${file}</small></span></article>`)}}
</script></body></html>
