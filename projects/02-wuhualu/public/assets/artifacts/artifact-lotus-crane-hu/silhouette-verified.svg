<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
  <title id="title">莲鹤方壶结构剪影</title>
  <desc id="desc">双足鹤、双层莲瓣、怪兽双耳、椭方高壶与双兽承托的结构示意，不复制具体纹饰。</desc>
  <rect width="240" height="300" fill="#eee9dc"/>
  <g fill="#171b1a">
    <!-- 鹤身、喙、翼与两足；长颈另用粗圆角曲线连接。 -->
    <circle cx="137" cy="20" r="7"/>
    <path d="M143 18h25l-24 7zM111 61c12-8 26-3 29 9 2 10-7 19-20 18-15-1-23-15-9-27z"/>
    <path d="M116 64 89 48l8 29zM132 66l23-13-11 27z"/>
    <path d="M112 82h5v20h-5zM126 82h5v20h-5z"/>
    <!-- 双层莲瓣只表达两圈张开的轮廓。 -->
    <path d="M34 111 55 84l22 19 18-28 25 25 25-25 19 28 21-19 21 27z"/>
    <path d="M48 125 70 101l20 18 30-20 30 20 20-18 22 24z" opacity=".88"/>
    <!-- 椭方壶颈、腹与圈足。 -->
    <path d="M65 118h110l-8 46c-4 22 17 33 20 65 2 24-18 39-67 39s-69-15-67-39c3-32 24-43 20-65z"/>
    <path d="M65 256h110l9 18H56z"/>
    <!-- 回首兽双耳与底部双兽承托，只做体量示意。 -->
    <path d="M65 151c-24-16-40-2-38 17 2 18 19 22 34 10l16-13zM175 151c24-16 40-2 38 17-2 18-19 22-34 10l-16-13z"/>
    <path d="M55 270c-20-5-35 5-34 17 1 9 15 11 31 5l48-15zM185 270c20-5 35 5 34 17-1 9-15 11-31 5l-48-15z"/>
  </g>
  <path d="M136 26c-19 4-9 22-19 38" stroke="#171b1a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <g stroke="#9b7950" stroke-width="3" fill="none" opacity=".82">
    <path d="M120 117v141M69 145h102M59 244h122"/>
    <path d="M42 165c8-10 17-10 25 0M198 165c-8-10-17-10-25 0"/>
  </g>
</svg>
