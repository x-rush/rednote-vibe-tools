<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="彩沙瓶">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2c1f17"/>
      <stop offset="0.55" stop-color="#4a3020"/>
      <stop offset="1" stop-color="#1b120c"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.28" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffbe78" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffbe78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a33"/>
      <stop offset="0.45" stop-color="#633f25"/>
      <stop offset="1" stop-color="#331d10"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.1" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#cfe6e6" stop-opacity="0.12"/>
      <stop offset="0.86" stop-color="#ffe9c8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.56"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b071"/>
      <stop offset="0.5" stop-color="#c58f52"/>
      <stop offset="1" stop-color="#8f5f2f"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d3a4"/>
      <stop offset="0.45" stop-color="#d9ab6d"/>
      <stop offset="1" stop-color="#a97a42"/>
    </linearGradient>
    <linearGradient id="sandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f7e3a8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bottleClip">
      <path d="M212 96 L300 96 L300 190 C 300 206 344 232 344 292 L344 402 C 344 416 328 424 256 424 C 184 424 168 416 168 402 L168 292 C 168 232 212 206 212 190 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#room)"/>
  <rect width="512" height="512" rx="112" fill="url(#pool)"/>

  <!-- 桌面 -->
  <rect x="0" y="322" width="512" height="190" fill="url(#desk)"/>
  <rect x="0" y="316" width="512" height="7" fill="#ffcf9a" opacity="0.35"/>
  <g stroke="#2a170b" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round">
    <path d="M0 366 C 130 358 250 374 512 362"/>
    <path d="M0 416 C 150 408 260 424 512 410"/>
    <path d="M0 466 C 140 460 280 474 512 460"/>
  </g>

  <!-- 桌上散落的沙 -->
  <g>
    <circle cx="104" cy="432" r="6" fill="#e8735a"/>
    <circle cx="126" cy="450" r="4" fill="#f5d76e"/>
    <circle cx="88" cy="458" r="3.4" fill="#7fc9a6"/>
    <circle cx="118" cy="416" r="3" fill="#f2a154"/>
    <circle cx="410" cy="444" r="5" fill="#f5d76e"/>
    <circle cx="432" cy="430" r="3.4" fill="#e8735a"/>
    <circle cx="396" cy="412" r="3" fill="#7fc9a6"/>
  </g>

  <!-- 瓶身投影 -->
  <ellipse cx="256" cy="428" rx="104" ry="16" fill="#180c04" opacity="0.45"/>

  <!-- 瓶内彩沙：三层彩沙堆成的山形 -->
  <g clip-path="url(#bottleClip)">
    <rect x="168" y="192" width="176" height="232" fill="#1b120c" opacity="0.55"/>
    <!-- 底层 珊瑚 -->
    <path d="M168 340 L344 340 L344 424 L168 424 Z" fill="#e8735a"/>
    <!-- 中层 薄荷（山形） -->
    <path d="M168 340 L344 340 L344 286 C 320 280 300 258 288 232 C 272 198 240 198 224 232 C 212 258 192 280 168 286 Z" fill="#7fc9a6"/>
    <!-- 顶层 明黄 -->
    <path d="M224 232 C 240 198 272 198 288 232 C 272 226 240 226 224 232 Z" fill="#f5d76e"/>
    <!-- 沙层高光 -->
    <rect x="168" y="336" width="176" height="7" fill="#ffffff" opacity="0.22"/>
    <path d="M168 286 C 192 280 212 258 224 232 C 240 226 272 226 288 232 C 300 258 320 280 344 286" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5"/>
    <!-- 颗粒质感 -->
    <g fill="#ffffff" opacity="0.22">
      <circle cx="196" cy="404" r="3.4"/>
      <circle cx="228" cy="416" r="2.6"/>
      <circle cx="262" cy="398" r="3"/>
      <circle cx="300" cy="412" r="2.4"/>
      <circle cx="326" cy="396" r="3.2"/>
      <circle cx="206" cy="366" r="2.8"/>
      <circle cx="252" cy="352" r="2.4"/>
      <circle cx="302" cy="364" r="2.8"/>
      <circle cx="238" cy="312" r="2.6"/>
      <circle cx="284" cy="318" r="2.4"/>
      <circle cx="256" cy="272" r="2.4"/>
    </g>
  </g>

  <!-- 玻璃瓶身 -->
  <path d="M212 96 L300 96 L300 190 C 300 206 344 232 344 292 L344 402 C 344 416 328 424 256 424 C 184 424 168 416 168 402 L168 292 C 168 232 212 206 212 190 Z" fill="url(#glass)"/>
  <path d="M212 96 L300 96 L300 190 C 300 206 344 232 344 292 L344 402 C 344 416 328 424 256 424 C 184 424 168 416 168 402 L168 292 C 168 232 212 206 212 190 Z" fill="none" stroke="#fff4dc" stroke-opacity="0.72" stroke-width="7" stroke-linejoin="round"/>
  <!-- 左上高光 -->
  <path d="M198 250 C 190 300 190 356 196 402 L214 402 C 208 352 208 300 216 254 Z" fill="#ffffff" opacity="0.46"/>
  <rect x="203" y="256" width="5" height="120" rx="2.5" fill="#ffffff" opacity="0.3"/>

  <!-- 瓶口木塞 -->
  <path d="M206 58 L306 58 L300 100 L212 100 Z" fill="url(#cork)"/>
  <path d="M206 58 L306 58 L300 100 L212 100 Z" fill="none" stroke="#6f451d" stroke-opacity="0.5" stroke-width="3"/>
  <rect x="198" y="48" width="116" height="14" rx="7" fill="#cf9455"/>
  <g fill="#6f451d" opacity="0.35">
    <circle cx="230" cy="72" r="2"/>
    <circle cx="262" cy="84" r="1.6"/>
    <circle cx="284" cy="68" r="1.8"/>
  </g>

  <!-- 塑形小铲 -->
  <g transform="rotate(26 404 372)">
    <rect x="386" y="250" width="24" height="132" rx="12" fill="url(#stick)"/>
    <rect x="386" y="250" width="24" height="132" rx="12" fill="none" stroke="#6f451d" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="392" y="258" width="5" height="112" rx="2.5" fill="#fff0cf" opacity="0.4"/>
    <ellipse cx="398" cy="252" rx="12" ry="6" fill="#efd0a0"/>
  </g>

  <!-- 高光点缀 -->
  <g fill="#ffe9b8" opacity="0.8">
    <circle cx="92" cy="150" r="5"/>
    <circle cx="428" cy="158" r="3.4"/>
    <circle cx="128" cy="196" r="2.6"/>
  </g>
</svg>
