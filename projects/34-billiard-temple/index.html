<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>玉球金殿 · 弹珠神殿</title>
<meta name="description" content="一颗玉球，八重金殿">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <img class="brand-logo" src="./logo.svg" alt="" width="26" height="26">
      <span id="title">玉球金殿</span>
    </div>
    <p id="subtitle"></p>
  </header>

  <section id="hud" hidden>
    <div class="glass hud-card">
      <div class="hud-top">
        <span class="chamber" id="chamberRoom">1/8</span>
        <span class="chamber-name" id="chamberName"></span>
      </div>
      <div class="progress" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="神殿进度">
        <i id="progressFill"></i>
      </div>
      <div class="hud-main">
        <span class="stat"><em id="shotsLabel">🎯</em><b id="shotsLeft">4</b></span>
        <span class="stat"><em id="gemLabel">💠</em><b id="gemCount">0</b></span>
      </div>
      <div class="codex-ribbon" id="codexRibbon" aria-label="宝石图鉴"></div>
    </div>
  </section>

  <section id="stage">
    <canvas id="field" aria-label="神殿殿堂与玉球"></canvas>
    <div id="flash" role="status" aria-live="polite"></div>
    <!-- 原版提示 chip：标题 / 标语 / howto1，第一杆按下后收起 -->
    <div id="hintChip" class="hint-chip" hidden>
      <h2 id="hintTitle"></h2>
      <p id="hintTagline"></p>
      <p class="hint-howto" id="hintHowto"></p>
    </div>
    <!-- 原版手势提示：脉动圆环 + 「拖动瞄准」 -->
    <div id="gestureHint" class="gesture-hint-wrap" hidden>
      <div class="gesture-hint" aria-hidden="true"></div>
      <p id="gestureText"></p>
    </div>
  </section>

  <footer id="footbar">
    <button id="muteBtn" type="button" aria-pressed="true">声音 开</button>
  </footer>

  <section id="intro" class="panel-layer">
    <div class="panel">
      <div class="panel-glow"></div>
      <img class="panel-logo" src="./logo.svg" alt="玉球金殿" width="72" height="72">
      <h2 id="startTitle">玉球金殿</h2>
      <div id="startLines" class="lines"></div>
      <button id="startBtn" type="button" class="primary">进入神殿</button>
    </div>
  </section>

  <section id="result" class="panel-layer" hidden>
    <div class="panel wide">
      <div class="panel-glow"></div>
      <h2 id="resultTitle"></h2>
      <div class="result-gems">
        <b id="resultGems">0</b>
        <span id="resultSub"></span>
      </div>
      <p class="shelf-label" id="shelfLabel">宝石图鉴</p>
      <div id="codex" class="codex"></div>
      <canvas id="shareCard" width="720" height="960" aria-label="玉球金殿技巧卡"></canvas>
      <div class="actions">
        <button id="saveBtn" type="button" class="ghost">保存技巧卡</button>
        <button id="againBtn" type="button" class="primary">再玩一次</button>
      </div>
      <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>
<script src="./content.js"></script>
<script src="./game.js"></script>
<script src="./render.js"></script>
<script src="./audio.js"></script>
<script src="./storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
