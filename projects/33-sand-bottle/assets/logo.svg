<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="彩沙瓶">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ead3"/>
      <stop offset="1" stop-color="#e6c9a4"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4703f"/>
      <stop offset="1" stop-color="#6b4429"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#e6f0ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a86a"/>
      <stop offset="1" stop-color="#a3713c"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c088"/>
      <stop offset="1" stop-color="#b4813f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#wall)"/>

  <!-- 桌面 -->
  <rect x="0" y="318" width="512" height="194" fill="url(#desk)"/>
  <rect x="0" y="312" width="512" height="8" fill="#c58f56" opacity="0.7"/>
  <g stroke="#4f331d" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <path d="M0 356 C 130 348 250 364 512 352"/>
    <path d="M0 404 C 150 396 260 412 512 398"/>
    <path d="M0 452 C 140 446 280 460 512 446"/>
  </g>

  <!-- 瓶子投影 -->
  <ellipse cx="256" cy="432" rx="112" ry="18" fill="#3a2412" opacity="0.24"/>

  <!-- 瓶内彩沙 -->
  <g>
    <!-- 薄荷层 + 山形沙面（收在瓶肩以内） -->
    <path d="M186 240 L326 240 L326 216 C 306 210 290 200 278 186 C 262 170 250 170 234 186 C 222 200 206 210 186 216 Z" fill="#7fc9a6"/>
    <!-- 明黄层 -->
    <path d="M186 240 L326 240 L348 292 L164 292 Z" fill="#f5d76e"/>
    <!-- 蜜橘层 -->
    <path d="M164 292 L348 292 L348 352 L164 352 Z" fill="#f2a154"/>
    <!-- 珊瑚层 -->
    <path d="M164 352 L348 352 L348 418 L164 418 Z" fill="#e8735a"/>
    <!-- 沙粒高光 -->
    <g fill="#ffffff" opacity="0.28">
      <circle cx="188" cy="392" r="3.4"/>
      <circle cx="214" cy="404" r="2.6"/>
      <circle cx="246" cy="386" r="3"/>
      <circle cx="288" cy="400" r="2.4"/>
      <circle cx="320" cy="384" r="3.2"/>
      <circle cx="200" cy="326" r="2.8"/>
      <circle cx="252" cy="336" r="2.4"/>
      <circle cx="302" cy="322" r="2.8"/>
      <circle cx="228" cy="264" r="2.6"/>
      <circle cx="288" cy="272" r="2.4"/>
    </g>
  </g>

  <!-- 玻璃瓶身 -->
  <path d="M212 96 L300 96 L300 196 C 300 208 352 236 352 300 L352 402 C 352 416 336 424 256 424 C 176 424 160 416 160 402 L160 300 C 160 236 212 208 212 196 Z" fill="url(#glass)"/>
  <path d="M212 96 L300 96 L300 196 C 300 208 352 236 352 300 L352 402 C 352 416 336 424 256 424 C 176 424 160 416 160 402 L160 300 C 160 236 212 208 212 196 Z" fill="none" stroke="#ffffff" stroke-opacity="0.86" stroke-width="9" stroke-linejoin="round"/>
  <path d="M196 250 C 188 300 188 360 194 404 L212 404 C 206 356 206 300 214 254 Z" fill="#ffffff" opacity="0.42"/>

  <!-- 瓶口木塞 -->
  <path d="M204 62 L308 62 L302 100 L210 100 Z" fill="url(#cork)"/>
  <path d="M204 62 L308 62 L302 100 L210 100 Z" fill="none" stroke="#8a5c2c" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="196" y="52" width="120" height="14" rx="6" fill="#c48c4e"/>

  <!-- 塑形小棒 -->
  <g transform="rotate(28 404 372)">
    <rect x="386" y="248" width="22" height="150" rx="11" fill="url(#stick)"/>
    <rect x="386" y="248" width="22" height="150" rx="11" fill="none" stroke="#8a5c2c" stroke-opacity="0.4" stroke-width="3"/>
    <ellipse cx="397" cy="250" rx="11" ry="6" fill="#efd0a0"/>
  </g>

  <!-- 桌上散落的沙 -->
  <g>
    <circle cx="106" cy="404" r="5" fill="#e8735a"/>
    <circle cx="124" cy="418" r="3.4" fill="#f5d76e"/>
    <circle cx="92" cy="426" r="3" fill="#7fc9a6"/>
    <circle cx="118" cy="392" r="2.6" fill="#f2a154"/>
    <circle cx="404" cy="430" r="4" fill="#f5d76e"/>
    <circle cx="420" cy="418" r="2.8" fill="#e8735a"/>
  </g>

  <!-- 高光点缀 -->
  <g fill="#ffe9b8" opacity="0.75">
    <circle cx="96" cy="140" r="4"/>
    <circle cx="424" cy="150" r="3"/>
  </g>
</svg>
