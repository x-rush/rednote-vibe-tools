<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关系说明书与对话复盘 · 完整语义图标复检</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202a27;color:#edf1eb;font-family:system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:48px 24px 80px}.kicker{font-size:11px;letter-spacing:.22em;color:#aebbb5}h1{font:700 42px/1.25 "Noto Serif SC","Songti SC",serif;margin:10px 0 14px}p{max-width:820px;color:#bdc7c2;line-height:1.75}.section{margin-top:38px;border-top:1px solid #52605a;padding-top:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#f5f2e9;color:#29312e;padding:18px;border-radius:14px;min-height:104px}.row{display:flex;align-items:center;gap:18px;height:100%}.sizes{display:flex;align-items:center;gap:12px;min-width:154px}.sizes img{display:block}.s16{width:16px;height:16px}.s20{width:20px;height:20px}.s24{width:24px;height:24px}.s32{width:32px;height:32px}.label b{display:block;font-size:15px}.label small{display:block;color:#707a75;line-height:1.5;margin-top:4px}.checks{margin-top:34px;background:#313d39;padding:18px;line-height:1.8;border-radius:12px}@media(max-width:760px){h1{font-size:32px}.grid{grid-template-columns:1fr}.sizes{min-width:142px}}
</style></head><body><main class="wrap"><div class="kicker">SEMANTIC QA · 2026.08.24</div><h1>成熟、中性、能在 16px 被认出来。</h1><p>本页不是风格展示，而是第二批语义盲审板。图标必须脱离颜色仍可区分，且不把关系工具做成恋爱测试、不把复盘工具做成聊天软件。</p>
<section class="section"><h2>我希望被这样对待 · 7 章与 3 个状态</h2><div class="grid" id="relationship"></div></section>
<section class="section"><h2>当时这样说就好了 · 5 步与 3 个安全／隐私状态</h2><div class="grid" id="conversation"></div></section>
<div class="checks"><b>人工拒绝条件</b><br>看起来像恋爱爱心、情侣绑定、聊天气泡、医疗诊断、监控或官方认证时，立即退回；隐私图标必须配文字，不能单凭图形承诺数据安全。</div>
</main><script>
const groups={relationship:{root:'../projects/05-relationship-manual/public/assets/icons/',items:[['chapter-companionship.svg','陪伴','并肩而非绑定'],['chapter-boundary.svg','边界','保持连接，也保留界线'],['chapter-comfort.svg','安慰','承接和稳定，不使用爱心'],['chapter-conflict.svg','面对分歧','分流、回看与继续'],['chapter-care.svg','日常关心','温度与注意，不暗示恋爱'],['chapter-advice.svg','听建议的方式','内容卡片与补充'],['chapter-mutual-effort.svg','我也会努力','双向循环与可调整'],['privacy-local.svg','仅本机保存','设备与锁定状态'],['sensitive-content.svg','敏感内容','默认不展示'],['edit-conflict.svg','编辑冲突','文档与修订动作']]},conversation:{root:'../projects/07-conversation-replay/public/assets/icons/',items:[['step-fact.svg','事实','可以被核对的内容'],['step-feeling.svg','感受','身体与情绪波动，不用爱心'],['step-inference.svg','推测','可撤回的解释'],['step-need.svg','需要','中心需求与支撑'],['step-request.svg','请求','具体内容进入下一步行动'],['privacy-incognito.svg','无痕模式','退出后不保留'],['privacy-local.svg','本机保存','只写入本设备'],['safety-priority.svg','安全优先','安全提示，不是认证章']]}};
for(const [id,g] of Object.entries(groups)){const host=document.getElementById(id);for(const [file,name,note] of g.items){const src=g.root+file;host.insertAdjacentHTML('beforeend',`<article class="card"><div class="row"><div class="sizes"><img class="s16" src="${src}" alt=""><img class="s20" src="${src}" alt=""><img class="s24" src="${src}" alt=""><img class="s32" src="${src}" alt=""></div><span class="label"><b>${name}</b><small>${note}</small></span></div></article>`)}}
</script></body></html>
