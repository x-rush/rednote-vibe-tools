<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>毽子连击</title>
<meta name="description" content="看准甜区带，一脚一脚踢上天">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <img class="brand-logo" src="./logo.svg" alt="" width="26" height="26">
      <span id="title">毽子连击</span>
    </div>
    <p id="subtitle"></p>
  </header>

  <section id="hud" hidden>
    <div class="hud-card">
      <div class="hud-top">
        <div class="hud-main">
          <span class="hud-label" id="hudRallyLabel">连踢</span>
          <b id="rally">0</b>
        </div>
        <div class="hud-side">
          <span class="hud-level" id="yardName"></span>
          <span class="hud-target" id="kickCount"></span>
        </div>
      </div>
      <div class="progress" id="kickBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="踢法解锁进度">
        <i id="kickFill"></i>
      </div>
      <div class="hud-foot">
        <span class="hud-combo"><b id="combo">×0</b></span>
        <span class="hud-wind"><i id="hudWindLabel">风力</i><b id="windPips" aria-label="风力"><i></i><i></i><i></i><i></i></b></span>
        <span class="hud-kick" id="lastKick"></span>
        <span class="hud-tier"><i id="hudTierLabel">羽色</i><b id="tierName"></b></span>
      </div>
    </div>
  </section>

  <section id="stage">
    <canvas id="field" aria-label="毽子连击场地"></canvas>
    <div id="flash" role="status" aria-live="polite"></div>
    <div id="hint" role="status" aria-live="polite"></div>
  </section>

  <footer id="footbar">
    <button id="muteBtn" type="button" aria-pressed="true">静音</button>
    <span id="bestHint"></span>
  </footer>

  <section id="intro" class="panel-layer">
    <div class="panel">
      <div class="panel-glow"></div>
      <img class="panel-logo" src="./logo.svg" alt="毽子连击" width="72" height="72">
      <h2 id="startTitle">毽子连击</h2>
      <div id="startLines" class="lines"></div>
      <button id="startBtn" type="button" class="primary">开踢</button>
      <p class="tip">点亮时轻触即可将毽子踢起</p>
    </div>
  </section>

  <section id="result" class="panel-layer" hidden>
    <div class="panel wide">
      <div class="panel-glow"></div>
      <h2 id="resultTitle"></h2>
      <p id="landedLine" class="landed-line"></p>
      <p id="resultSubtitle" class="result-subtitle"></p>
      <div class="result-stats">
        <div><b id="resultRally">0</b><span id="resultRallyLabel">连击</span></div>
        <div><b id="resultBest">0</b><span id="resultBestLabel">最佳</span></div>
        <div><b id="resultHighest">0</b><span id="resultHighestLabel">最高踢击</span></div>
        <div><b id="resultKickTypes">0/12</b><span id="resultKickTypesLabel">已使用踢法</span></div>
        <div><b id="resultCourtyard">#1/12</b><span id="resultCourtyardLabel">场地</span></div>
        <div><b id="resultCombo">×0</b><span id="resultComboLabel">最高连击</span></div>
        <div><b id="resultWind">0/4</b><span id="resultWindLabel">风力</span></div>
      </div>
      <div id="resultChips" class="result-chips"></div>
      <p id="resultDetail" class="result-detail"></p>
      <p id="bestFlag" class="best-flag" hidden>新纪录连击！</p>
      <canvas id="shareCard" width="720" height="960" aria-label="连踢纪录卡"></canvas>
      <div class="actions">
        <button id="againBtn" type="button" class="primary">再来一次</button>
        <button id="saveBtn" type="button" class="ghost">保存纪录卡</button>
      </div>
      <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>
<script src="./content.js"></script>
<script src="./game.js"></script>
<script src="./render.js"></script>
<script src="./audio.js"></script>
<script src="./storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
