<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>沙丘速降</title>
<meta name="description" content="穿过旗门，把雪崩压回去">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="glass brand-card">
      <div class="brand">
        <img class="brand-logo" src="./logo.svg" alt="" width="26" height="26">
        <span id="title">沙丘速降</span>
      </div>
      <p id="subtitle"></p>
    </div>
    <div class="glass hud-pill" id="hud" hidden>
      <span class="hud-m"><b id="distance">0</b>m</span>
      <span class="hud-sep">·</span>
      <span class="hud-gates">🚩<b id="flagCount">0</b></span>
    </div>
  </header>

  <section id="stage">
    <canvas id="field" aria-label="沙丘坡面与雪崩"></canvas>
    <div id="howto" hidden>
      <div class="gesture-hint"></div>
      <p id="howtoText"></p>
    </div>
  </section>

  <footer id="footbar">
    <button id="muteBtn" type="button" aria-pressed="true">声音 开</button>
    <span id="bestHint"></span>
  </footer>

  <section id="intro" class="panel-layer">
    <div class="panel">
      <div class="panel-glow"></div>
      <img class="panel-logo" src="./logo.svg" alt="沙丘速降" width="72" height="72">
      <h2 id="startTitle">沙丘速降</h2>
      <p id="tagline" class="tip"></p>
      <div id="startLines" class="lines"></div>
      <button id="startBtn" type="button" class="primary">开始</button>
    </div>
  </section>

  <section id="result" class="panel-layer" hidden>
    <div class="panel">
      <div class="panel-glow"></div>
      <h2 id="resultTitle">你的滑降</h2>
      <div class="result-figure">
        <b id="resultMeters">0</b>
        <span id="resultSub">米</span>
      </div>
      <p id="resultFlags" class="result-gates">0 旗门</p>
      <p id="bestFlag" class="best-flag" hidden>新纪录！</p>
      <canvas id="shareCard" width="720" height="960" aria-label="沙丘速降滑降线纪录卡"></canvas>
      <div class="actions">
        <button id="shareBtn" type="button" class="primary">分享</button>
        <button id="againBtn" type="button" class="ghost">再玩一次</button>
      </div>
      <p id="shareStatus" class="save-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>
<script src="./content.js"></script>
<script src="./game.js"></script>
<script src="./render.js"></script>
<script src="./audio.js"></script>
<script src="./storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
